[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.1.0"
description = "Machine-learning quantitative trading research system with leakage-resistant validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Live market data. Kept optional on purpose: the default pipeline runs fully
# offline on the synthetic provider, so tests and CI never depend on a vendor API.
data = ["yfinance>=0.2.40"]
report = ["reportlab>=4.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "pypdf>=4.0",
]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::FutureWarning"]
