name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,report]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Test
        run: pytest --cov=quantlab --cov-report=term-missing

      # The whole suite runs on the synthetic provider, so CI needs no network
      # access and no market-data credentials.
      - name: Smoke-test the pipeline end to end
        run: python scripts/run_pipeline.py --config configs/strategies/momentum_rf.yaml
